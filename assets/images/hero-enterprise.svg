<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hero-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="hero-grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Decorative Grid & Glows -->
  <circle cx="650" cy="150" r="220" fill="url(#glow-grad)" filter="url(#blur-glow)" />
  <circle cx="200" cy="400" r="180" fill="url(#glow-grad)" filter="url(#blur-glow)" />
  
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800 M0,450 H800" />
    <path d="M100,0 V500 M200,0 V500 M300,0 V500 M400,0 V500 M500,0 V500 M600,0 V500 M700,0 V500" />
  </g>

  <!-- Molecular/Scientific Graphic Pattern -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2" fill="none">
    <polygon points="520,120 570,90 620,120 620,180 570,210 520,180" />
    <polygon points="620,120 670,90 720,120 720,180 670,210 620,180" />
    <polygon points="570,210 620,240 620,300 570,330 520,300 520,240" />
    <circle cx="570" cy="90" r="6" fill="#38bdf8" />
    <circle cx="620" cy="120" r="6" fill="#34d399" />
    <circle cx="670" cy="90" r="6" fill="#38bdf8" />
    <circle cx="570" cy="210" r="6" fill="#f43f5e" />
    <circle cx="620" cy="240" r="6" fill="#38bdf8" />
  </g>

  <!-- Main Hero Graphic Illustration: High-Tech R&D Facility & Medicine Vessel -->
  <g filter="url(#card-shadow)">
    <!-- Central Glass Container Visual -->
    <rect x="220" y="70" width="360" height="340" rx="24" fill="url(#glass-card-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Header of central card -->
    <rect x="250" y="100" width="140" height="10" rx="5" fill="#38bdf8" opacity="0.8" />
    <rect x="250" y="120" width="220" height="6" rx="3" fill="#94a3b8" opacity="0.5" />

    <!-- Scientific Flask & Medicine R&D Symbol -->
    <g transform="translate(340, 150)">
      <!-- Flask Glow -->
      <circle cx="60" cy="110" r="70" fill="url(#hero-grad-primary)" opacity="0.25" filter="url(#blur-glow)" />
      <!-- Flask Body -->
      <path d="M45,20 L75,20 L75,60 L110,120 A20,20 0 0,1 95,150 L25,150 A20,20 0 0,1 10,120 L45,60 Z" fill="rgba(15, 118, 110, 0.4)" stroke="#38bdf8" stroke-width="3" />
      <!-- Fluid Level -->
      <path d="M22,125 Q60,115 98,125 L93,145 A10,10 0 0,1 85,150 L35,150 A10,10 0 0,1 27,145 Z" fill="url(#hero-grad-accent)" opacity="0.85" />
      <!-- DNA Helix inside/overlay Flask -->
      <path d="M60,30 Q80,50 60,70 Q40,90 60,110 Q80,130 60,145" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4,4" />
      <path d="M60,30 Q40,50 60,70 Q80,90 60,110 Q40,130 60,145" fill="none" stroke="#34d399" stroke-width="2" />
      <!-- Floating bubbles -->
      <circle cx="55" cy="100" r="4" fill="#ffffff" opacity="0.9" />
      <circle cx="70" cy="80" r="3" fill="#ffffff" opacity="0.7" />
      <circle cx="50" cy="65" r="5" fill="#38bdf8" opacity="0.8" />
    </g>

    <!-- Stat Bar inside Card -->
    <rect x="250" y="330" width="300" height="50" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="275" cy="355" r="12" fill="#10b981" />
    <path d="M270,355 L274,359 L281,351" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="298" y="352" fill="#ffffff" font-size="13" font-weight="700">WHO-GMP &amp; ISO Certified</text>
    <text x="298" y="367" fill="#94a3b8" font-size="11">100% International Quality Compliance</text>
  </g>

  <!-- Left Floating Metric Pill Card -->
  <g filter="url(#card-shadow)" transform="translate(60, 140)">
    <rect width="210" height="85" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="42" cy="42" r="22" fill="url(#hero-grad-primary)" />
    <!-- Heartbeat / Shield Icon -->
    <path d="M34,42 H40 L43,34 L47,50 L51,39 L54,42 H58" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="38" fill="#ffffff" font-size="18" font-weight="800">50+ Countries</text>
    <text x="76" y="56" fill="#38bdf8" font-size="12" font-weight="600">Global Supply Reach</text>
  </g>

  <!-- Right Floating Metric Pill Card -->
  <g filter="url(#card-shadow)" transform="translate(530, 280)">
    <rect width="220" height="90" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="44" cy="45" r="22" fill="#059669" />
    <!-- Star/Pill Icon -->
    <path d="M38,45 A6,6 0 0,1 50,45 A6,6 0 0,1 38,45 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="38" y1="45" x2="50" y2="45" stroke="#ffffff" stroke-width="2" />
    <text x="78" y="38" fill="#ffffff" font-size="18" font-weight="800">150+ Formulations</text>
    <text x="78" y="56" fill="#34d399" font-size="12" font-weight="600">Therapeutic Excellence</text>
  </g>

  <!-- Bottom Interactive HUD Line -->
  <path d="M100,450 Q400,470 700,450" fill="none" stroke="url(#hero-grad-accent)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
</svg>
