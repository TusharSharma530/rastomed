<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <path d="M0,60 H600 M0,120 H600 M0,180 H600 M0,240 H600 M0,300 H600" />
    <path d="M120,0 V400 M240,0 V400 M360,0 V400 M480,0 V400" />
  </g>

  <!-- Automated Conveyor & Robotic Arm Graphic -->
  <g transform="translate(180, 90)">
    <rect x="20" y="80" width="200" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="60" cy="100" r="12" fill="#34d399" />
    <circle cx="120" cy="100" r="12" fill="#34d399" />
    <circle cx="180" cy="100" r="12" fill="#34d399" />
    <rect x="80" y="30" width="80" height="40" rx="6" fill="#10b981" opacity="0.8" />
    <text x="120" y="170" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Automated Packaging</text>
  </g>

  <rect x="20" y="20" width="130" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
  <text x="85" y="38" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">FACILITIES</text>
</svg>
