<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #042f2e 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p2-bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="p2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#06b6d4" opacity="0.15" />

  <!-- Inhaler / Spray Bottle Render -->
  <g filter="url(#p2-shadow)" transform="translate(135, 35)">
    <!-- Nozzle Top -->
    <rect x="52" y="10" width="36" height="30" rx="6" fill="#ffffff" />
    <path d="M70,20 L80,20" stroke="#0891b2" stroke-width="3" stroke-linecap="round" />
    
    <!-- Main Body -->
    <rect x="25" y="40" width="90" height="180" rx="20" fill="url(#p2-bottle)" />
    
    <!-- Label -->
    <rect x="30" y="70" width="80" height="120" rx="8" fill="#ffffff" />
    <rect x="38" y="85" width="64" height="6" rx="3" fill="#06b6d4" />
    
    <!-- Wave / Lungs Icon -->
    <path d="M50,115 Q60,105 70,115 T90,115" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" />
    <path d="M50,125 Q60,115 70,125 T90,125" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

    <text x="70" y="150" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">RespiCare</text>
    <text x="70" y="165" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600">200 Metered Doses</text>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="115" height="28" rx="14" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" />
  <text x="77" y="38" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">GENERAL CARE</text>
</svg>
