<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p1-bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="p1-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="p1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Light & Grid -->
  <circle cx="200" cy="150" r="120" fill="#ef4444" opacity="0.15" />
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 H400 M0,100 H400 M0,150 H400 M0,200 H400 M0,250 H400" />
    <path d="M100,0 V300 M200,0 V300 M300,0 V300" />
  </g>

  <!-- Product Bottle Render -->
  <g filter="url(#p1-shadow)" transform="translate(130, 45)">
    <!-- Cap -->
    <rect x="42" y="10" width="56" height="25" rx="4" fill="url(#p1-cap)" />
    <!-- Neck -->
    <rect x="48" y="35" width="44" height="15" fill="#e2e8f0" />
    <!-- Bottle Body -->
    <rect x="20" y="50" width="100" height="160" rx="16" fill="url(#p1-bottle)" />
    
    <!-- White Label -->
    <rect x="26" y="70" width="88" height="115" rx="6" fill="#ffffff" />
    <rect x="34" y="82" width="72" height="6" rx="3" fill="#ef4444" />
    
    <!-- Heartbeat Icon on Label -->
    <path d="M50,110 H56 L60,98 L66,122 L72,106 L76,110 H82" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="70" y="145" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">CardioShield</text>
    <text x="70" y="160" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600">60 Film Coated Tablets</text>
  </g>

  <!-- Floating Badge Pill -->
  <rect x="20" y="20" width="100" height="28" rx="14" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" />
  <text x="70" y="38" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">CARDIOLOGY</text>
</svg>
