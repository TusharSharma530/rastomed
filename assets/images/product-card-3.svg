<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p3-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <filter id="p3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#8b5cf6" opacity="0.15" />

  <!-- Pharmaceutical Box Packaging -->
  <g filter="url(#p3-shadow)" transform="translate(125, 40)">
    <!-- Box Body -->
    <rect x="15" y="30" width="120" height="190" rx="10" fill="url(#p3-box)" stroke="rgba(255,255,255,0.2)" />
    
    <!-- Diagonal Brand Accent -->
    <path d="M15,80 L135,40 L135,100 L15,140 Z" fill="rgba(255,255,255,0.15)" />

    <!-- Brain/Synapse Graphic -->
    <circle cx="75" cy="110" r="22" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="75" cy="110" r="10" fill="#c4b5fd" />
    <circle cx="60" cy="95" r="4" fill="#a78bfa" />
    <circle cx="90" cy="125" r="4" fill="#a78bfa" />
    
    <text x="75" y="160" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">NeuroBalance</text>
    <text x="75" y="176" text-anchor="middle" fill="#ddd6fe" font-size="9" font-weight="600">30 Capsule Blister Pack</text>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="100" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" />
  <text x="70" y="38" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">NEUROLOGY</text>
</svg>
