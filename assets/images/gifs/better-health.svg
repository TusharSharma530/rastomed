<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.16); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
    }
    .health-outer-ring { fill: none; stroke: #90caf9; stroke-width: 2; opacity: 0.85; }
    .health-inner-ring { fill: none; stroke: #0d47a1; stroke-width: 2.5; }
    .health-heart { fill: #0d47a1; transform-origin: 50px 36px; animation: heartBeat 2.2s infinite ease-in-out; }
    .health-hand { fill: none; stroke: #0d47a1; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <circle cx="50" cy="50" r="47" class="health-outer-ring" />
  <circle cx="50" cy="50" r="42" class="health-inner-ring" />
  <!-- Heart shape -->
  <path class="health-heart" d="M50 46 C50 46 33 35 33 27 C33 21 38 17 44 19 C47 20 50 23 50 23 C50 23 53 20 56 19 C62 17 67 21 67 27 C67 35 50 46 50 46 Z" />
  <!-- Hand underneath heart -->
  <path class="health-hand" d="M28 56 C34 52 42 54 48 58 L54 62 C58 64 64 62 68 56 C70 52 67 49 63 50 L54 53 C50 54 45 49 40 49 C34 49 28 56 28 56 Z" />
  <path class="health-hand" d="M24 65 C29 61 38 59 48 64" />
</svg>