<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes plusGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #0d47a1); }
    }
    .shield-outer-ring { fill: none; stroke: #90caf9; stroke-width: 2; opacity: 0.85; }
    .shield-inner-ring { fill: none; stroke: #0d47a1; stroke-width: 2.5; }
    .shield-body { fill: none; stroke: #0d47a1; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; transform-origin: 50px 48px; animation: shieldPulse 3s infinite ease-in-out; }
    .shield-plus { fill: #0d47a1; animation: plusGlow 2s infinite ease-in-out; }
  </style>
  <circle cx="50" cy="50" r="47" class="shield-outer-ring" />
  <circle cx="50" cy="50" r="42" class="shield-inner-ring" />
  <path class="shield-body" d="M50 24 L68 31 C68 49 59 62 50 68 C41 62 32 49 32 31 Z" />
  <path class="shield-plus" d="M46 38 H54 V44 H60 V52 H54 V58 H46 V52 H40 V44 H46 Z" />
</svg>