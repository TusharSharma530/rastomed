<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #451a03 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p4-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="p4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#f59e0b" opacity="0.15" />

  <!-- Pharmaceutical Packaging Box -->
  <g filter="url(#p4-shadow)" transform="translate(130, 40)">
    <rect x="15" y="30" width="110" height="190" rx="12" fill="url(#p4-box)" stroke="rgba(255,255,255,0.2)" />
    
    <!-- Joint/Bone Graphic Icon -->
    <g transform="translate(45, 80)">
      <rect x="0" y="20" width="40" height="12" rx="6" fill="#ffffff" />
      <circle cx="10" cy="15" r="8" fill="#fde68a" />
      <circle cx="30" cy="15" r="8" fill="#fde68a" />
      <circle cx="10" cy="37" r="8" fill="#fde68a" />
      <circle cx="30" cy="37" r="8" fill="#fde68a" />
    </g>

    <text x="70" y="160" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">OsteoFlex</text>
    <text x="70" y="176" text-anchor="middle" fill="#fef3c7" font-size="9" font-weight="600">Advanced Bone Support</text>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="100" height="28" rx="14" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" />
  <text x="70" y="38" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">ORTHOPEDIC</text>
</svg>
