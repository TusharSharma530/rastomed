<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="g1-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" opacity="0.1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#g1-glow)" />
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600" />
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400" />
  </g>

  <!-- High-Tech Microscopic & Lab Equipment Symbol -->
  <g transform="translate(200, 100)">
    <rect x="20" y="30" width="160" height="180" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="100" cy="110" r="45" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="100" cy="110" r="20" fill="#38bdf8" opacity="0.8" />
    <text x="100" y="240" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Cleanroom R&amp;D Suite</text>
  </g>

  <rect x="20" y="20" width="120" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" />
  <text x="80" y="38" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">R&amp;D LABS</text>
</svg>
