<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 16px; overflow: hidden;">
  <defs>
    <linearGradient id="ab-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="ab-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" opacity="0.4" />
    </linearGradient>
    <filter id="ab-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Decorative Tech Background Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M0,40 H600 M0,80 H600 M0,120 H600 M0,160 H600 M0,200 H600 M0,240 H600 M0,280 H600 M0,320 H600 M0,360 H600 M0,400 H600" />
    <path d="M60,0 V450 M120,0 V450 M180,0 V450 M240,0 V450 M300,0 V450 M360,0 V450 M420,0 V450 M480,0 V450 M540,0 V450" />
  </g>

  <!-- Corporate Headquarter & Facility Graphic -->
  <g filter="url(#ab-shadow)">
    <!-- Main Tower Building Visual -->
    <rect x="180" y="80" width="160" height="300" rx="8" fill="url(#ab-grad-2)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Secondary Lab Wing Building -->
    <rect x="340" y="150" width="140" height="230" rx="8" fill="rgba(15, 118, 110, 0.4)" stroke="#0d9488" stroke-width="1.5" />

    <!-- Glass Windows Lines -->
    <g fill="#38bdf8" opacity="0.7">
      <rect x="200" y="110" width="35" height="15" rx="3" />
      <rect x="245" y="110" width="35" height="15" rx="3" />
      <rect x="290" y="110" width="35" height="15" rx="3" />

      <rect x="200" y="140" width="35" height="15" rx="3" />
      <rect x="245" y="140" width="35" height="15" rx="3" />
      <rect x="290" y="140" width="35" height="15" rx="3" />

      <rect x="200" y="170" width="35" height="15" rx="3" />
      <rect x="245" y="170" width="35" height="15" rx="3" />
      <rect x="290" y="170" width="35" height="15" rx="3" />

      <rect x="200" y="200" width="35" height="15" rx="3" />
      <rect x="245" y="200" width="35" height="15" rx="3" />
      <rect x="290" y="200" width="35" height="15" rx="3" />

      <!-- Wing Windows -->
      <rect x="360" y="180" width="40" height="14" rx="2" fill="#34d399" />
      <rect x="415" y="180" width="40" height="14" rx="2" fill="#34d399" />
      <rect x="360" y="210" width="40" height="14" rx="2" fill="#34d399" />
      <rect x="415" y="210" width="40" height="14" rx="2" fill="#34d399" />
    </g>

    <!-- Entrance & Canopy -->
    <rect x="220" y="320" width="80" height="60" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <path d="M210,320 L310,320" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="260" cy="350" r="14" fill="#0284c7" />
    <text x="256" y="356" fill="#ffffff" font-size="16" font-weight="bold">P</text>
  </g>

  <!-- Overlay Stats Badge Badge Pill -->
  <g filter="url(#ab-shadow)" transform="translate(40, 260)">
    <rect width="180" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="24" y="44" fill="#38bdf8" font-size="32" font-weight="900">25+</text>
    <text x="24" y="68" fill="#ffffff" font-size="14" font-weight="700">Years of Innovation</text>
    <text x="24" y="88" fill="#94a3b8" font-size="12">Global R&amp;D Excellence</text>
    <circle cx="145" cy="40" r="16" fill="#0d9488" opacity="0.3" />
    <path d="M140,40 L144,44 L152,36" fill="none" stroke="#34d399" stroke-width="2.5" />
  </g>

  <!-- Floating Quality Seal -->
  <g filter="url(#ab-shadow)" transform="translate(380, 50)">
    <rect width="170" height="75" rx="14" fill="rgba(15, 23, 42, 0.95)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="35" cy="38" r="18" fill="#059669" />
    <path d="M29,38 L33,42 L41,34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <text x="64" y="32" fill="#ffffff" font-size="13" font-weight="800">WHO-GMP</text>
    <text x="64" y="48" fill="#34d399" font-size="11" font-weight="600">Certified Facility</text>
  </g>
</svg>
