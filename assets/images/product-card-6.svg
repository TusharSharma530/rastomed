<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #4c0519 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p6-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="p6-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#f43f5e" opacity="0.15" />

  <!-- Pharmaceutical Packaging Box Visual -->
  <g filter="url(#p6-shadow)" transform="translate(130, 40)">
    <rect x="15" y="30" width="110" height="190" rx="12" fill="url(#p6-box)" stroke="rgba(255,255,255,0.2)" />
    
    <!-- Venus Symbol Graphic -->
    <g transform="translate(70, 105)">
      <circle cx="0" cy="-10" r="14" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <line x1="0" y1="4" x2="0" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-8" y1="14" x2="8" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <text x="70" y="165" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">GynoCare</text>
    <text x="70" y="181" text-anchor="middle" fill="#fecdd3" font-size="9" font-weight="600">Women's Wellness</text>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="80" height="28" rx="14" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" />
  <text x="60" y="38" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="700">GYNAE</text>
</svg>
