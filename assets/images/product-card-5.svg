<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="p5-bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="p5-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#10b981" opacity="0.15" />

  <!-- Syrup Bottle Visual -->
  <g filter="url(#p5-shadow)" transform="translate(135, 40)">
    <!-- Cap -->
    <rect x="42" y="10" width="56" height="24" rx="4" fill="#ffffff" />
    <!-- Neck -->
    <rect x="48" y="34" width="44" height="16" fill="#e2e8f0" />
    <!-- Body -->
    <rect x="25" y="50" width="90" height="170" rx="16" fill="url(#p5-bottle)" />
    
    <!-- White Label -->
    <rect x="30" y="75" width="80" height="120" rx="6" fill="#ffffff" />
    <rect x="38" y="90" width="64" height="6" rx="3" fill="#10b981" />

    <!-- Gastro Stomach Icon -->
    <path d="M55,125 C50,110 65,100 75,115 C85,130 90,120 80,140 C75,148 60,145 55,125 Z" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

    <text x="70" y="160" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">GastroEase</text>
    <text x="70" y="175" text-anchor="middle" fill="#64748b" font-size="9" font-weight="600">200 ml Oral Syrup</text>
  </g>

  <!-- Category Badge -->
  <rect x="20" y="20" width="80" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
  <text x="60" y="38" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">GASTRO</text>
</svg>
