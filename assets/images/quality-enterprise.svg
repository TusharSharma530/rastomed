<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%); font-family: system-ui, -apple-system, sans-serif; border-radius: 16px; overflow: hidden;">
  <defs>
    <linearGradient id="q-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="q-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rays & Glow -->
  <circle cx="300" cy="225" r="180" fill="#10b981" opacity="0.1" />
  
  <g filter="url(#q-shadow)" transform="translate(150, 75)">
    <!-- Shield Outline -->
    <path d="M150,20 L270,60 V160 C270,230 150,280 150,280 C150,280 30,230 30,160 V60 Z" fill="rgba(15, 23, 42, 0.85)" stroke="url(#q-grad)" stroke-width="3" />
    
    <!-- Inner Check & Ribbon -->
    <circle cx="150" cy="140" r="50" fill="url(#q-grad)" />
    <path d="M130,140 L145,155 L175,125" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="150" y="215" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="900">WHO-GMP CERTIFIED</text>
    <text x="150" y="235" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">100% Quality &amp; Zero Tolerance Policy</text>
  </g>
</svg>
